spring.application.name=vorynza
server.port=8080

# ========== Microsoft SQL Server Express (VERIFIED WORKING) ==========
# SQLEXPRESS is listening on dynamic TCP port 17127 (not 1433).
# SQL Browser is stopped, so localhost\\SQLEXPRESS over TCP fails from JDBC.
# Login created: vorynza / Vorynza@12345  |  Database: VorynzaDB
spring.datasource.url=jdbc:sqlserver://localhost:17127;databaseName=VorynzaDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=root
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Keep @Table names exact (WeddingPackages, Halls, ...) — do not snake_case them.
# Otherwise Hibernate writes to wedding_packages while SQL FKs point at WeddingPackages.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# Ignore harmless "object already exists" noise during schema update
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR

vorynza.jwt.secret=VorynzaWeddingHotelSecretKeyForJwtTokensMustBeLongEnough123456
vorynza.jwt.expiration-ms=86400000
vorynza.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
